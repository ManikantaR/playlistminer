name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '20'

jobs:
  dotnet-build-and-test:
    name: .NET Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: playlistminer_test
          POSTGRES_USER: pmuser
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Enable pg_trgm extension
        run: |
          PGPASSWORD=testpassword psql -h localhost -U pmuser -d playlistminer_test -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - name: Run Unit Tests
        run: dotnet test tests/PlaylistMiner.UnitTests --no-build --configuration Release --logger "trx;LogFileName=unit-results.trx" --collect:"XPlat Code Coverage"

      - name: Run Integration Tests
        run: dotnet test tests/PlaylistMiner.IntegrationTests --no-build --configuration Release --logger "trx;LogFileName=integration-results.trx"
        env:
          ConnectionStrings__Default: "Host=localhost;Port=5432;Database=playlistminer_test;Username=pmuser;Password=testpassword"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dotnet-test-results
          path: "**/TestResults/**"

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dotnet-coverage
          path: "**/coverage.cobertura.xml"

  frontend-build-and-test:
    name: Frontend Build & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/web

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Run Jest tests
        run: npm test -- --coverage --ci

      - name: Build
        run: npm run build

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: src/web/coverage/

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [dotnet-build-and-test, frontend-build-and-test]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: playlistminer_e2e
          POSTGRES_USER: pmuser
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/web/package-lock.json

      - name: Enable pg_trgm
        run: |
          PGPASSWORD=testpassword psql -h localhost -U pmuser -d playlistminer_e2e -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - name: Build and start API
        run: |
          dotnet build --configuration Release
          dotnet run --project src/PlaylistMiner.Api --configuration Release &
        env:
          ConnectionStrings__Default: "Host=localhost;Port=5432;Database=playlistminer_e2e;Username=pmuser;Password=testpassword"
          ASPNETCORE_URLS: "http://localhost:5000"

      - name: Wait for API
        run: |
          until curl -sf http://localhost:5000/health; do
            sleep 2
          done

      - name: Install frontend dependencies
        working-directory: src/web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: src/web
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        working-directory: src/web
        run: npx playwright test
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: src/web/playwright-report/
