services:
  pm-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: playlistminer
      POSTGRES_USER: ${POSTGRES_USER:-playlistminer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-playlistminer}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pm-api:
    build:
      context: .
      dockerfile: src/PlaylistMiner.Api/Dockerfile
    ports:
      - "${API_PORT:-5000}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__playlistminer: "Host=pm-db;Database=playlistminer;Username=${POSTGRES_USER:-playlistminer};Password=${POSTGRES_PASSWORD}"
      YouTube__ApiKey: ${YOUTUBE_API_KEY}
      YouTube__ClientId: ${YOUTUBE_CLIENT_ID}
      YouTube__ClientSecret: ${YOUTUBE_CLIENT_SECRET}
      YouTube__EncryptionKey: ${YOUTUBE_ENCRYPTION_KEY}
      YouTube__RedirectUri: http://localhost:${API_PORT:-5000}/api/oauth/callback
    depends_on:
      pm-db:
        condition: service_healthy

  pm-worker:
    build:
      context: .
      dockerfile: src/PlaylistMiner.Worker/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__playlistminer: "Host=pm-db;Database=playlistminer;Username=${POSTGRES_USER:-playlistminer};Password=${POSTGRES_PASSWORD}"
      YouTube__ApiKey: ${YOUTUBE_API_KEY}
      YouTube__ClientId: ${YOUTUBE_CLIENT_ID}
      YouTube__ClientSecret: ${YOUTUBE_CLIENT_SECRET}
      YouTube__EncryptionKey: ${YOUTUBE_ENCRYPTION_KEY}
    depends_on:
      pm-db:
        condition: service_healthy

  pm-web:
    build:
      context: src/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5050}
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
    depends_on:
      - pm-api

  pm-ollama:
    image: ollama/ollama
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    profiles:
      - ai

volumes:
  pgdata:
  ollama-data:
