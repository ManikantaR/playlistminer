# PlaylistMiner — NAS production stack (Docker on UGREEN DXP4800+ / UGOS)
#
# DOCKER (not podman) compose for the always-on NAS deployment. Local Mac dev uses
# podman-compose.yml. See docs/NAS-DEPLOYMENT-SPEC.md + ADR-009.
#
# Mirrors the homelab conventions (homelab-stack/docker-compose.moneypulse.yml):
#  - Traefik on macvlan 10.140.1.3 owns 80/443; entrypoint "websecure" + tls=true.
#  - Real domain home.manikantar.com with wildcard Let's Encrypt (Route 53). AdGuard
#    resolves *.home.manikantar.com → 10.140.1.3.
#  - Shared external network "traefik-public"; data under /volume1/docker/playlistminer/.
#  - Ollama is NOT here — it runs on the Mac; the worker calls it over the LAN.
#
# Prereqs on NAS: `docker network create traefik-public` (already exists for the fleet);
# infra stack (Traefik/AdGuard) running.

networks:
  traefik-public:
    external: true
  pm-internal:
    driver: bridge

services:
  pm-db:
    image: postgres:16-alpine
    container_name: pm-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: playlistminer
      POSTGRES_USER: ${POSTGRES_USER:-playlistminer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - /volume1/docker/playlistminer/pg:/var/lib/postgresql/data
    networks:
      - pm-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-playlistminer}"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "traefik.enable=false"

  pm-api:
    build:
      # Absolute context: the central compose lives at /volume1/docker/, source at repo/
      context: /volume1/docker/playlistminer/repo
      dockerfile: src/PlaylistMiner.Api/Dockerfile
    container_name: pm-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      TZ: America/New_York
      ConnectionStrings__playlistminer: "Host=pm-db;Database=playlistminer;Username=${POSTGRES_USER:-playlistminer};Password=${POSTGRES_PASSWORD}"
      YouTube__ApiKey: ${YOUTUBE_API_KEY}
      YouTube__ClientId: ${YOUTUBE_CLIENT_ID}
      YouTube__ClientSecret: ${YOUTUBE_CLIENT_SECRET}
      YouTube__EncryptionKey: ${YOUTUBE_ENCRYPTION_KEY}
      # Real HTTPS domain — OAuth completes directly on the NAS (browser resolves via AdGuard).
      # This exact URI must be registered in Google Console as an Authorized redirect URI.
      YouTube__RedirectUri: https://playlistminer.home.manikantar.com/api/oauth/callback
      # API health reports Ollama reachability; keep it aligned with the worker.
      Categorization__OllamaBaseUrl: ${MAC_OLLAMA_URL:-http://host.docker.internal:11434}
      Categorization__OllamaModel: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
      Categorization__MaxVideosPerRun: ${CATEGORIZATION_MAX_VIDEOS_PER_RUN:-200}
      PublicAI__GeminiApiKey: ${GEMINI_API_KEY:-}
      PublicAI__OpenAIApiKey: ${OPENAI_API_KEY:-}
    depends_on:
      pm-db:
        condition: service_healthy
    networks:
      - pm-internal
      - traefik-public
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.pm-api.rule=Host(`playlistminer.home.manikantar.com`) && PathPrefix(`/api`)"
      - "traefik.http.routers.pm-api.entrypoints=websecure"
      - "traefik.http.routers.pm-api.tls=true"
      - "traefik.http.routers.pm-api.priority=10"
      - "traefik.http.services.pm-api.loadbalancer.server.port=8080"
      - "com.centurylinklabs.watchtower.enable=false"

  pm-worker:
    build:
      context: /volume1/docker/playlistminer/repo
      dockerfile: src/PlaylistMiner.Worker/Dockerfile
    container_name: pm-worker
    restart: unless-stopped
    environment:
      DOTNET_ENVIRONMENT: Production
      TZ: America/New_York
      ConnectionStrings__playlistminer: "Host=pm-db;Database=playlistminer;Username=${POSTGRES_USER:-playlistminer};Password=${POSTGRES_PASSWORD}"
      YouTube__ApiKey: ${YOUTUBE_API_KEY}
      YouTube__ClientId: ${YOUTUBE_CLIENT_ID}
      YouTube__ClientSecret: ${YOUTUBE_CLIENT_SECRET}
      YouTube__EncryptionKey: ${YOUTUBE_ENCRYPTION_KEY}
      # Inference runs on the Mac. Set MAC_OLLAMA_URL in .env → http://<mac-lan-ip>:11434
      # (Ollama must bind 0.0.0.0 on the Mac: launchctl setenv OLLAMA_HOST 0.0.0.0)
      Categorization__OllamaBaseUrl: ${MAC_OLLAMA_URL:-http://host.docker.internal:11434}
      Categorization__OllamaModel: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
      Categorization__MaxVideosPerRun: ${CATEGORIZATION_MAX_VIDEOS_PER_RUN:-200}
      PublicAI__GeminiApiKey: ${GEMINI_API_KEY:-}
      PublicAI__OpenAIApiKey: ${OPENAI_API_KEY:-}
    volumes:
      - /volume1/docker/playlistminer/backup:/app/backups
      - /volume1/docker/playlistminer/concepts:/app/concepts
    depends_on:
      pm-db:
        condition: service_healthy
    networks:
      - pm-internal
    labels:
      - "traefik.enable=false"
      - "com.centurylinklabs.watchtower.enable=false"

  pm-web:
    build:
      context: /volume1/docker/playlistminer/repo/src/web
      dockerfile: Dockerfile
      args:
        # Baked in at BUILD time (Next.js). HOST ROOT (no /api suffix) — PlaylistMiner's
        # api-client already prefixes paths with /api. Traefik routes /api → pm-api.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://playlistminer.home.manikantar.com}
    container_name: pm-web
    restart: unless-stopped
    environment:
      - INTERNAL_API_URL=http://pm-api:8080
      - HOSTNAME=0.0.0.0
    depends_on:
      pm-api:
        condition: service_healthy
    networks:
      - traefik-public
      - pm-internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.pm-web.rule=Host(`playlistminer.home.manikantar.com`)"
      - "traefik.http.routers.pm-web.entrypoints=websecure"
      - "traefik.http.routers.pm-web.tls=true"
      - "traefik.http.routers.pm-web.priority=1"
      - "traefik.http.services.pm-web.loadbalancer.server.port=3000"
      - "com.centurylinklabs.watchtower.enable=false"
